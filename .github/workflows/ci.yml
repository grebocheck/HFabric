name: CI

# The whole pipeline runs in STUB mode (no GPU/ML stack), so the queue ->
# arbiter swap -> gallery flow and the memory-budget logic are all CI-testable
# on a plain Linux runner. See backend/tests and frontend/src/**/*.test.*.

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  backend:
    name: backend (ruff + pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install light deps + test tools
        run: |
          pip install --require-hashes -r requirements-dev.lock
          pip check
      - name: Audit Python dependencies
        run: |
          for attempt in 1 2 3; do
            pip-audit -r requirements-foundation.lock --no-deps --disable-pip && exit 0
            [ "$attempt" = 3 ] || sleep 5
          done
          exit 1
      - name: Audit Python development graph
        run: |
          for attempt in 1 2 3; do
            pip-audit -r requirements-dev.lock --no-deps --disable-pip && exit 0
            [ "$attempt" = 3 ] || sleep 5
          done
          exit 1
      - name: Audit compiled GPU lock
        run: |
          for attempt in 1 2 3; do
            python ../scripts/audit_gpu_lock.py && exit 0
            [ "$attempt" = 3 ] || sleep 5
          done
          exit 1
      - name: Lint
        run: ruff check app tests scripts
      - name: Check dead Python code
        run: vulture app scripts ../scripts --min-confidence 90
      - name: Check dependency profile consistency
        run: python ../scripts/check_dependency_consistency.py
      - name: Check all dependency locks are reproducible
        working-directory: ${{ github.workspace }}
        run: python scripts/install_profiles.py --check-locks
      - name: Scan tracked files for secrets
        working-directory: .
        run: python scripts/check_secrets.py
      - name: Check Bash launcher syntax
        run: bash -n ../run.sh ../setup.sh ../update.sh
      - name: Check OpenAPI schema
        run: python scripts/export_openapi.py ../frontend/openapi.json --check
      - name: Test (stub mode)
        run: |
          set -o pipefail
          pytest \
            --randomly-dont-reorganize \
            --randomly-dont-reset-seed \
            --junitxml=test-results.xml \
            --cov=app \
            --cov-branch \
            --cov-report=term \
            --cov-report=term-missing:skip-covered \
            --cov-report=xml:coverage.xml \
            --cov-report=json:coverage.json \
            --cov-fail-under=75 | tee coverage.txt
          python - <<'PY' | tee coverage-summary.md
          import json

          totals = json.load(open("coverage.json", encoding="utf-8"))["totals"]
          print("### Backend coverage")
          print()
          print(f"- Lines: {totals['percent_statements_covered_display']}%")
          print(f"- Branches: {totals['percent_branches_covered_display']}%")
          print(f"- Combined: {totals['percent_covered_display']}%")
          PY
          {
            cat coverage-summary.md
            echo
            echo '<details><summary>Per-file coverage</summary>'
            echo
            echo '```text'
            cat coverage.txt
            echo '```'
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Repeat deterministic suite
        run: pytest --randomly-dont-reorganize --randomly-dont-reset-seed
      - name: Run shuffled suite
        run: pytest --randomly-seed=20260723
      - name: Upload backend test artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-test-results
          path: |
            backend/test-results.xml
            backend/coverage.xml
            backend/coverage.json
            backend/coverage.txt
            backend/coverage-summary.md

  frontend:
    name: frontend (tsc + vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install deps
        run: npm ci
      - name: Audit npm dependency graph
        run: |
          for attempt in 1 2 3; do
            npm audit --audit-level=high && exit 0
            [ "$attempt" = 3 ] || sleep 5
          done
          exit 1
      - name: Lint
        run: npm run lint
      - name: Check dead TypeScript code
        run: npm run lint:dead
      - name: Check generated API types
        run: npm run openapi:check
      - name: Typecheck
        run: npm run typecheck
      - name: Build frontend
        run: |
          npm run build
          node -e "const fs=require('fs'),z=require('zlib'),p=require('path'); const rows=[]; for(const f of fs.readdirSync('dist/assets')){const b=fs.readFileSync(p.join('dist/assets',f)); rows.push({file:f,bytes:b.length,gzip:z.gzipSync(b).length})}; rows.sort((a,b)=>b.gzip-a.gzip); fs.writeFileSync('bundle-sizes.json',JSON.stringify(rows,null,2)+'\n'); console.table(rows)"
      - name: Test with coverage
        run: |
          set -o pipefail
          npm run test:coverage | tee vitest.txt
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser E2E + axe
        env:
          E2E_BASE_URL: http://127.0.0.1:4173
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill "$PREVIEW_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            curl --fail --silent http://127.0.0.1:4173/ >/dev/null && break
            [ "$attempt" = 60 ] && { cat preview.log; exit 1; }
            sleep 0.25
          done
          npm run test:e2e
      - name: Upload frontend test artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: frontend-test-results
          path: |
            frontend/bundle-sizes.json
            frontend/vitest.txt
            frontend/coverage/coverage-summary.json
            frontend/playwright-report
            frontend/test-results
            frontend/preview.log

  windows-stub:
    name: Windows STUB smoke
    runs-on: windows-latest
    defaults:
      run:
        working-directory: backend
    env:
      HFAB_STUB_MODE: "true"
      HFAB_HOST: "127.0.0.1"
      HFAB_API_TOKEN: ""
      HFAB_ALLOW_INSECURE_LAN: "false"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install STUB dependencies
        run: |
          python -m pip install --require-hashes -r requirements-dev.lock
          python -m pip check
      - name: Parse PowerShell launchers
        shell: pwsh
        run: |
          $files = @("..\scripts\run.ps1", "..\setup.ps1", "..\update.ps1")
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $file),
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count) {
              throw "$file has parser errors: $($errors.Message -join '; ')"
            }
          }
      - name: Run critical STUB flows
        run: python -m pytest tests/test_stub_integration.py tests/test_security.py tests/test_pidfiles.py
