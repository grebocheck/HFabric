name: Isolated Python tools
description: Install the hashed STUB and test graph without runner-global packages
runs:
  using: composite
  steps:
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: "3.12"
        cache: pip
        cache-dependency-path: backend/requirements-dev.lock
    - name: Create isolated Python environment
      shell: bash
      working-directory: ${{ github.workspace }}
      run: |
        python -m venv "$RUNNER_TEMP/hfabric-python"
        python - <<'PY'
        import os
        from pathlib import Path

        scripts = Path(os.environ["RUNNER_TEMP"]) / "hfabric-python" / ("Scripts" if os.name == "nt" else "bin")
        with open(os.environ["GITHUB_PATH"], "a", encoding="utf-8") as path:
            path.write(f"{scripts}\n")
        PY
    - name: Install hashed Python tools
      shell: bash
      working-directory: ${{ github.workspace }}
      run: |
        python -c 'import sys; assert sys.prefix != sys.base_prefix, "CI requires an isolated venv"'
        python -m pip install --require-hashes -r backend/requirements-dev.lock
        python -m pip check
